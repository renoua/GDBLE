plugins {
    id 'com.android.library'
}

// Doit correspondre à la version du moteur (godot --version).
def godotVersion = '4.6.2.stable'

android {
    namespace 'com.lesjeuxducycle.ble'
    compileSdk 35

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // Classes Java de btleplug (droidplug) : compilées depuis le vendor, jamais copiées.
            java.srcDirs = [
                'src/main/java',
                '../../vendor/btleplug/src/droidplug/java/src/main/java'
            ]
        }
    }
}

dependencies {
    compileOnly "org.godotengine:godot:${godotVersion}"
}
