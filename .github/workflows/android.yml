name: Android BLE (libs + plugin)

# Produit :
#  - (dans ljdc) addons/gdble_ljdc/bin/android/{arm64-v8a,x86_64}/libgdble_ljdc.so  (crate Rust)
#  - addons/ljdc_android_ble/bin/ljdc_ble-{debug,release}.aar            (pont Java/JNI)
# Télécharger l'artefact « android-ble » et copier les fichiers aux chemins ci-dessus.

on:
  workflow_dispatch:
  push:
    tags: ['android-ble-*']

jobs:
  rust-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c   # r28+ : bibliothèques alignées sur 16 Ko par défaut (exigence Google Play)

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Installer cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Compiler les bibliothèques
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          # Ceinture et bretelles : alignement 16 Ko explicite, quelle que soit la version du NDK.
          RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
        run: |
          cargo ndk -t arm64-v8a -t x86_64 --platform 24 -o out build --release
          ls -l out/*/

      # Google Play refuse les appli ciblant Android 15+ dont une bibliothèque native a un segment
      # PT_LOAD aligné sur moins de 16 Ko (0x4000) : on échoue ici plutôt qu'à l'envoi.
      - name: Vérifier l'alignement 16 Ko et le symbole JNI
        run: |
          set -e
          for so in out/*/libgdble_ljdc.so; do
            echo "== $so"
            readelf -lW "$so" | awk '$1=="LOAD" {print $NF}' | sort -u
            if readelf -lW "$so" | awk '$1=="LOAD" {print $NF}' | grep -vq '^0x4000$\|^0x10000$'; then
              echo "::error::$so n'est pas aligné sur 16 Ko"; exit 1
            fi
            nm -D "$so" | grep -q 'Java_com_lesjeuxducycle_ble_LjdcBlePlugin_nativeInit' \
              || { echo "::error::$so n'exporte pas nativeInit (JNI)"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android-ble-libs
          path: out/*/libgdble_ljdc.so

  plugin-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Le SDK Android est préinstallé sur ubuntu-latest (setup-android@v3 échoue sur le
      # paquet obsolète « tools ») : on accepte les licences et on garantit la plateforme 35.
      - name: Préparer le SDK Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler les AAR
        working-directory: android_plugin
        run: gradle :ljdc_ble:assembleDebug :ljdc_ble:assembleRelease

      - name: Renommer
        run: |
          mkdir -p out
          cp android_plugin/ljdc_ble/build/outputs/aar/ljdc_ble-debug.aar out/
          cp android_plugin/ljdc_ble/build/outputs/aar/ljdc_ble-release.aar out/

      - uses: actions/upload-artifact@v4
        with:
          name: android-ble-aar
          path: out/*.aar
